<style>
*{
    margin:0;
    padding:0;

}

html{

}

body{
    background:#0a0a0a;
    color:#fff;

}

.font-titulo{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:600;
}

.trabalho-header{
    padding:60px 8% 40px;
    text-align:center;
    border-bottom:1px solid #222;
}

.voltar{
    display:inline-block;
    color:#999;
    text-decoration:none;
    font-size:.9rem;
    letter-spacing:1px;
    margin-bottom:25px;
    transition:.3s;
}

.voltar:hover{
    color:#fff;
}

.trabalho-header h1{
    font-size:clamp(2.5rem, 6vw, 4.5rem);
    letter-spacing:2px;
}

.trabalho-header p{

    color:#999;
    font-size:1.1rem;
    letter-spacing:1px;
}

.trabalho-galeria{
    padding:60px 8%;
}

.galeria-masonry{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:15px;
}

.foto-card{
    aspect-ratio:4/5;
    border-radius:12px;
    overflow:hidden;
    background:#1a1a1a;
    border:1px solid #222;
}

.foto-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:0.4s;
}

.foto-card:hover img{
    transform:scale(1.05);
}

@media (max-width:900px){
    .galeria-masonry{
        grid-template-columns:repeat(2, 1fr);
    }
}

@media (max-width:500px){
    .galeria-masonry{
        grid-template-columns:1fr;
    }
}

footer{
    text-align:center;
    padding:30px;
    border-top:1px solid #222;
    color:#777;
}

@media (max-width:600px){
    .trabalho-header{
        padding:40px 6% 30px;
    }
}
</style>
